name: Refresh data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # UTC；北京时间每天 01:23、03:23……23:23，避开整点拥堵。
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore last successful Deribit snapshot
        uses: actions/cache@v4
        with:
          path: .runtime/pages-cache/gamma-last-good.json
          key: deribit-gamma-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            deribit-gamma-v2-${{ runner.os }}-

      - name: Refresh BTC seasonality
        continue-on-error: true
        run: node scripts/update-static-data.mjs --only=seasonality

      - name: Refresh ETF flows
        continue-on-error: true
        run: node scripts/update-static-data.mjs --only=etf --etf-source=auto

      - name: Validate static history
        run: npm run validate

      - name: Validate Deribit Gamma model
        run: npm run test:deribit

      - name: Build safe Pages artifact
        run: npm run build:pages

      - name: Validate Pages artifact
        run: npm run validate:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
